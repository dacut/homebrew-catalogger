[package]
name = "homebrew-catalog-classifier"
description = "Classify Homebrew formulae using an LLM"
keywords = ["Homebrew"]

authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true

[features]
default = ["bedrock"]
# Claude in Amazon Bedrock, with AWS credential resolution and SigV4 request signing.
bedrock = ["dep:aws-config", "dep:aws-credential-types", "dep:aws-sigv4", "tokio/sync"]

[dependencies]
aws-config = { version = "1.13", optional = true, features = ["behavior-version-latest"] }
aws-credential-types = { version = "1.3", optional = true }
aws-sigv4 = { version = "1.6", optional = true }
futures-util = "0.3"
reqwest = { version = "0.13", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["time"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread"] }
