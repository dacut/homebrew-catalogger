[package]
name = "homebrew-catalog-static-pages"
description = "Generate static website pages for serving Homebrew formula information by category"
keywords = ["Homebrew"]

authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true

[[bin]]
name = "homebrew-catalog-static-pages"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
homebrew-catalog-classifier.path = "../homebrew-catalog-classifier"
maud = "0.27"
serde_json = "1"

[dev-dependencies]
tempfile = "3"
