[package]
name = "homebrew-catalog-classifier-cli"
description = "Command line interface to homebrew-catalog-classifier"
keywords = ["Homebrew"]

authors.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true

[[bin]]
name = "homebrew-catalog-classifier"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
dotenvy = "0.15"
futures-util = "0.3"
homebrew-catalog-classifier.path = "../homebrew-catalog-classifier"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }

[dev-dependencies]
tempfile = "3"
